# Generated by `python -m nexusml.ui.theme`. Edit palette.py, not this file.
[theme]
base = "dark"
primaryColor = "#6CB7AC"
backgroundColor = "#14171C"
secondaryBackgroundColor = "#101318"
textColor = "#E4E2DC"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
headless = true
enableXsrfProtection = true
maxUploadSize = 200
fileWatcherType = "none"
