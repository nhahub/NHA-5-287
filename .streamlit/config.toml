# Generated by `python -m nexusml.ui.theme`. Edit palette.py, not this file.
[theme]
base = "light"
primaryColor = "#2F6F6A"
backgroundColor = "#F6F4EF"
secondaryBackgroundColor = "#EEEBE3"
textColor = "#262A31"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
headless = true
enableXsrfProtection = true
maxUploadSize = 200
fileWatcherType = "none"
